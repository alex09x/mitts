#
# Add to ~/.config/helix/languages.toml (Windows: %AppData%\helix\languages.toml), or to
# a project's .helix/languages.toml. rust-analyzer's on-save check and its runnables go
# through Mitts; rust-analyzer still loads the project with `cargo metadata`.

[language-server.rust-analyzer.config.check]
overrideCommand = ["mitts", "check", "--workspace", "--all-targets", "--message-format=json"]

[language-server.rust-analyzer.config.runnables]
command = "mitts"
