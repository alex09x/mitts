[package]
name = "mitts"
version = "0.1.0"
edition = "2021"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"
description = "Rust-first build and package tooling with a shared artifact cache"
repository = "https://github.com/alex09x/mitts"
homepage = "https://mittsbuild.com"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
semver = "1.0"
indicatif = "0.17"
miette = { version = "7.6", features = ["fancy", "derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"

[workspace]
members = ["."]
exclude = ["fixtures/hello-rust"]
