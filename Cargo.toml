[package]
name = "mitts"
version = "0.3.30"
edition = "2021"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"
description = "Rust-first build and package tooling with a shared artifact cache"
repository = "https://github.com/alex09x/mitts"
homepage = "https://mittsbuild.com"
exclude = ["/site/", "/benchmark-results/", "/readme/", "/scripts/", "/.github/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
semver = "1.0"
indicatif = "0.17"
miette = { version = "7.6", features = ["fancy", "derive"] }
toml = "0.8"
flate2 = "1.0"
tar = "0.4"
ureq = "2.10"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"

# Every tests/*.rs target links the whole library into its own executable. With full debug
# info that was 228 executables of about 90 MB each (20 GB of output, written once to target/
# and again to the cache), which dominated CI wall time. Source is always at hand, so the dev
# profile favors build speed and size over debuggability. Cold build of all test targets on a
# 4-CPU host: 72 s and 20.4 GB with debug info, 37.6 s and 4.3 GB without. Panic messages and
# locations are unaffected. Raise `debug` / drop `strip` locally when a debugger is needed.
[profile.dev]
debug = false
strip = "symbols"

[workspace]
members = ["."]
exclude = ["fixtures/hello-rust"]
