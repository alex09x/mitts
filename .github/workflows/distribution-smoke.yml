name: Published source installation

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source-sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published Mitts tag to verify
        type: string
        required: true
      source-sha:
        description: Exact source commit behind the published tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        method: [registry, git, checkout]
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - name: Install the published source and exercise the installed CLI
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          METHOD: ${{ matrix.method }}
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          cleanup() {
            find "$root" -type d -exec chmod u+w {} +
            rm -rf "$root"
          }
          trap cleanup EXIT
          curl -fsSL https://mittsbuild.com/install.sh -o "$root/install.sh"
          MITTS_INSTALL_ROOT="$root/bootstrap" sh "$root/install.sh"
          if [[ "$METHOD" == registry ]]; then
            curl -fsSL "https://crates.io/api/v1/crates/mitts/${TAG#v}/download" -o "$root/source.crate"
            mkdir "$root/unpacked"
            tar -xzf "$root/source.crate" -C "$root/unpacked"
            mv "$root/unpacked/mitts-${TAG#v}" "$root/source"
          elif [[ "$METHOD" == git ]]; then
            git clone --branch "$TAG" https://github.com/alex09x/mitts "$root/source"
            [[ "$(git -C "$root/source" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          else
            git clone --depth 1 --branch "$TAG" https://github.com/alex09x/mitts "$root/source"
            [[ "$(git -C "$root/source" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          fi
          "$root/bootstrap/bin/mitts" build --release --locked --manifest-path "$root/source/Cargo.toml" --target-dir "$root/target" --cache-dir "$root/build-cache"
          binary="$root/target/release/mitts"
          actual=$("$binary" --version)
          [[ "$actual" == "mitts ${TAG#v} ($SOURCE_SHA)" ]]
          "$binary" --help > /dev/null
          mkdir -p "$root/project/src"
          printf '[package]\nname="distribution-smoke"\nversion="0.0.0"\nedition="2021"\n' > "$root/project/Cargo.toml"
          printf 'pub fn answer() -> u8 {42}\n#[test] fn ok(){assert_eq!(answer(),42);}\n' > "$root/project/src/lib.rs"
          "$binary" test --no-run --manifest-path "$root/project/Cargo.toml" --cache-dir "$root/cache"
          printf 'SOURCE INSTALL OK: %s / %s\n' "$actual" "$METHOD"
