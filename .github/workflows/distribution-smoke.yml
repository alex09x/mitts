name: Published source installation

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source-sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        method: [registry, git, checkout]
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - name: Install the published source and exercise the installed CLI
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          METHOD: ${{ matrix.method }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-install-target
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          if [[ "$METHOD" == registry ]]; then
            # Exercise the advertised default: latest stable must be this release.
            cargo install mitts --locked --root "$root/prefix"
          elif [[ "$METHOD" == git ]]; then
            cargo install --git https://github.com/alex09x/mitts --tag "$TAG" mitts --locked --root "$root/prefix"
          else
            git clone --depth 1 --branch "$TAG" https://github.com/alex09x/mitts "$root/source"
            [[ "$(git -C "$root/source" rev-parse HEAD)" == "$SOURCE_SHA" ]]
            cargo install --path "$root/source" --locked --root "$root/prefix"
          fi
          binary="$root/prefix/bin/mitts"
          actual=$("$binary" --version)
          [[ "$actual" == "mitts ${TAG#v} ($SOURCE_SHA)" ]]
          "$binary" --help > /dev/null
          mkdir -p "$root/project/src"
          printf '[package]\nname="distribution-smoke"\nversion="0.0.0"\nedition="2021"\n' > "$root/project/Cargo.toml"
          printf 'pub fn answer() -> u8 {42}\n#[test] fn ok(){assert_eq!(answer(),42);}\n' > "$root/project/src/lib.rs"
          "$binary" test --no-run --manifest-path "$root/project/Cargo.toml" --cache-dir "$root/cache"
          printf 'SOURCE INSTALL OK: %s / %s\n' "$actual" "$METHOD"
