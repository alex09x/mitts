#
# Publishing uses the Marketplace's trusted publishing for this repository, this file name
# and the `vscode-marketplace` environment: no token exists. The environment requires the
# owner's approval, so a `vscode-v*` tag only queues the publish job until he approves it.
name: VS Code extension

on:
  pull_request:
    paths:
      - editors/vscode/**
      - .github/workflows/vscode-extension.yml
  push:
    branches: [main]
    paths:
      - editors/vscode/**
      - .github/workflows/vscode-extension.yml
    tags: ['vscode-v*']

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: editors/vscode

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        env:
          TAG: ${{ github.ref_name }}
        run: test "vscode-v$(node -p 'require("./package.json").version')" = "$TAG"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install latest stable Mitts
        uses: ./
        with:
          cache: 'false'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      # Tasks and diagnostics in a real VS Code. The rust-analyzer part is left to the
      # clean-machine check: rust-analyzer would launch Cargo, which this CI does not.
      - name: Integration test in VS Code
        env:
          MITTS_IT_RUST_ANALYZER: '0'
        run: xvfb-run -a npm run test:integration
      - id: pack
        run: |
          npm run package -- -o "$RUNNER_TEMP/"
          vsix=$(basename "$(ls "$RUNNER_TEMP"/*.vsix)")
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-extension
          path: ${{ runner.temp }}/${{ steps.pack.outputs.vsix }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vscode-extension
          path: ${{ runner.temp }}/vsix
      - name: Publish with trusted publishing
        working-directory: ${{ runner.temp }}/vsix
        env:
          VSIX: ${{ needs.package.outputs.vsix }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$VSIX"
