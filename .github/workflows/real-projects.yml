# Mitts Build — real projects on Linux, macOS and Windows, Mitts against Cargo as reference.
# Copyright (c) 2026 Alexander Panasenko
# Contact: alex@prod.codes
# Author: https://prod.codes/about/
# Project: https://github.com/alex09x/mitts
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The Mitts of this commit builds, runs and tests real projects on every platform it ships
# for, and each result is compared with Cargo's on the same runner: C through the `cc` crate
# (bat's oniguruma, zstd, tree-sitter), resource scripts (starship on Windows), the `windows`
# crates (sysinfo), proc-macro libraries (serde, clap, tokio), keyring backends per platform
# (soulseek-rs). Cargo runs only as the reference (owner decision 2026-11-25, AGENTS.md).
name: Real projects

on:
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - scripts/ci/project_check.ps1
      - .github/workflows/real-projects.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mitts:
    name: build mitts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build this commit's mitts with the released Mitts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MITTS_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'released'
          if ($IsWindows) {
            Get-Content -Raw site/install.ps1 | Invoke-Expression
            $released = Join-Path $env:MITTS_INSTALL_ROOT 'bin\mitts.exe'
          } else {
            sh site/install.sh
            if ($LASTEXITCODE -ne 0) { throw 'install.sh failed' }
            $released = Join-Path $env:MITTS_INSTALL_ROOT 'bin/mitts'
          }
          $env:MITTS_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'bootstrap-cache'
          & $released build --locked --release --bin mitts
          if ($LASTEXITCODE -ne 0) { throw 'mitts build failed' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = if ($IsWindows) { 'mitts.exe' } else { 'mitts' }
          Copy-Item (Join-Path target/release $exe) out/
          & (Join-Path out $exe) --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mitts-${{ matrix.os }}
          path: out/
          retention-days: 3

  project:
    name: ${{ matrix.project.name }} (${{ matrix.os }})
    needs: mitts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        project:
          - { name: ripgrep, repo: BurntSushi/ripgrep, ref: 14.1.1, bin: rg }
          - { name: fd, repo: sharkdp/fd, ref: v10.2.0, bin: fd }
          - { name: bat (oniguruma C), repo: sharkdp/bat, ref: v0.25.0, bin: bat }
          - { name: starship, repo: starship/starship, ref: v1.22.1, bin: starship }
          - { name: clap, repo: clap-rs/clap, ref: v4.5.27 }
          - { name: difftastic (tree-sitter C), repo: Wilfred/difftastic, ref: 0.62.0, bin: difft }
          - { name: bottom, repo: ClementTsang/bottom, ref: 0.10.2, bin: btm }
          - { name: just, repo: casey/just, ref: 1.38.0, bin: just }
          - { name: hyperfine, repo: sharkdp/hyperfine, ref: v1.19.0, bin: hyperfine }
          - { name: alacritty, repo: alacritty/alacritty, ref: v0.15.0, bin: alacritty, skip-tests: true }
          # keyring with a backend per platform (Secret Service, macOS keychain, Windows
          # credential store); a Milk-V Titan user once had to patch out its macOS backend
          # to build it with Mitts.
          - { name: soulseek-rs (keyring), repo: michel/soulseek-rs, ref: v20.0.0, bin: soulseek-rs }
          # No Cargo.lock: both resolve now. `-p tokio` alone is ambiguous (a published tokio
          # sits beside the member), and Mitts refuses it as Cargo does.
          - { name: tokio, repo: tokio-rs/tokio, ref: tokio-1.43.0, args: '-p tokio@1.43.0 --features full', skip-tests: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mitts-${{ matrix.os }}
          path: ${{ runner.temp }}/mitts
      - name: System libraries the projects link (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libfontconfig1-dev libfreetype6-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev
      - name: Check out ${{ matrix.project.repo }} ${{ matrix.project.ref }}
        shell: pwsh
        env:
          REPO: ${{ matrix.project.repo }}
          REF: ${{ matrix.project.ref }}
        run: |
          git -c core.autocrlf=false -c core.longpaths=true clone --quiet --depth 1 --branch $env:REF "https://github.com/$env:REPO" (Join-Path $env:RUNNER_TEMP 'project')
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
      - name: Mitts against Cargo
        shell: pwsh
        env:
          BIN: ${{ matrix.project.bin }}
          ARGS: ${{ matrix.project.args }}
          SKIP_TESTS: ${{ matrix.project.skip-tests }}
        run: |
          $mitts = Join-Path (Join-Path $env:RUNNER_TEMP 'mitts') ($IsWindows ? 'mitts.exe' : 'mitts')
          if (-not $IsWindows) { chmod +x $mitts }
          $params = @{ Project = (Join-Path $env:RUNNER_TEMP 'project'); Mitts = $mitts; Bin = "$env:BIN"; BuildArgs = "$env:ARGS" }
          if ($env:SKIP_TESTS -eq 'true') { $params['SkipTests'] = $true }
          ./scripts/ci/project_check.ps1 @params
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/project-check/*.log
          retention-days: 7
