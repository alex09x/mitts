name: Editors

on:
  pull_request:
    paths:
      - editors/vim/**
      - editors/emacs/**
      - .github/workflows/editors.yml
  push:
    branches: [main]
    paths:
      - editors/vim/**
      - editors/emacs/**
      - .github/workflows/editors.yml

permissions:
  contents: read

concurrency:
  group: editors-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Vim and Neovim plugin: the same tests in both, against the released Mitts, which
  # checks a broken project from inside the editor (MITTS_VIM_E2E).
  vim:
    name: ${{ matrix.editor }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        editor: [vim, neovim]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install latest stable Mitts
        uses: ./
        with:
          cache: 'false'
      - id: editor
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          version: stable
          neovim: ${{ matrix.editor == 'neovim' }}
      - name: Tests
        shell: bash
        env:
          MITTS_VIM_E2E: '1'
          EDITOR_BIN: ${{ steps.editor.outputs.executable }}
        run: |
          export MITTS_CACHE_DIR="$RUNNER_TEMP/mitts-cache"
          "$EDITOR_BIN" --version | head -1
          if [ "${{ matrix.editor }}" = neovim ]; then
            "$EDITOR_BIN" --headless -u NONE -i NONE -S editors/vim/test/run.vim && rc=0 || rc=$?
          else
            "$EDITOR_BIN" -Nu NONE -i NONE -es -S editors/vim/test/run.vim && rc=0 || rc=$?
          fi
          cat editors/vim/test/result.txt
          exit $rc

  # mitts.el: byte-compiled with warnings as errors, then its ERT tests, against the
  # released Mitts (MITTS_EMACS_E2E). 27.2 is the oldest Emacs it supports; it and 28.2
  # have no built-in `rust' error pattern, so mitts.el's own pattern is in use there.
  # nix-emacs-ci has no 27.2 for Apple silicon (macos-15): 28.2 there.
  emacs:
    name: Emacs ${{ matrix.emacs }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        emacs: ['27.2', '30.1']
        exclude:
          - os: macos-15
            emacs: '27.2'
        include:
          - os: macos-15
            emacs: '28.2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install latest stable Mitts
        uses: ./
        with:
          cache: 'false'
      - uses: jcs090218/setup-emacs@ffd830bca5865932d99c3d179263d8b0ebdd00c0 # v3
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile
        shell: bash
        working-directory: editors/emacs
        run: |
          emacs --version | head -1
          emacs --batch --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile mitts.el
      - name: Tests
        shell: bash
        working-directory: editors/emacs
        env:
          MITTS_EMACS_E2E: '1'
        run: |
          export MITTS_CACHE_DIR="$RUNNER_TEMP/mitts-cache"
          emacs --batch -L . -l test/mitts-test.el -f ert-run-tests-batch-and-exit
