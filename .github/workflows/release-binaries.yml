name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to package
        required: true
        default: v0.3.18
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      verify-only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          VERIFY_ONLY: ${{ inputs.verify-only }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-v0.3.18}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag=$GITHUB_REF_NAME; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$VERIFY_ONLY" == true ]]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            commit=$(git rev-parse "$SOURCE_SHA^{commit}")
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            commit=$(git rev-parse "$tag^{commit}")
            [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" == "$commit" ]]
          else
            echo 'A published tag is required outside candidate verification.' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"
  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Point only the disposable runner tag at the tested candidate; never push it
        if: inputs.verify-only
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        working-directory: release-source
        run: |
          git tag --force "$RELEASE_TAG" HEAD
      - name: Package exact-tag binary and prove path hygiene
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/release/package.sh release-source "$RELEASE_TAG" "$RELEASE_TARGET" dist
      - name: Installer regressions
        run: python3 scripts/release/test_installer.py
      - name: Install the packaged native binary into an isolated prefix
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/release/test_installer.py --archive "dist/mitts-$RELEASE_TAG-$RELEASE_TARGET.tar.gz" "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  # Publication is a separate reviewed operation. Never create/move tags or
  # overwrite existing release assets from an ordinary branch push.
