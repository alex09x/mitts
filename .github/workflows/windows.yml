#
# Windows bring-up for 0.5.0. There is no released Windows Mitts yet, and the Cargo CLI is
# not used, so the first Windows binary is cross-built by Mitts on Linux for
# x86_64-pc-windows-gnu (MinGW). The Windows job then uses it to build Mitts natively for
# MSVC and runs the suite with that build.

name: windows

on:
  workflow_dispatch:
  push:
    branches: [feat/windows]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross:
    name: cross-build mitts.exe (x86_64-pc-windows-gnu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-gnu
      - name: MinGW-w64 toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Install latest stable Mitts
        env:
          MITTS_INSTALL_ROOT: ${{ runner.temp }}/mitts-bootstrap
        run: |
          sh site/install.sh
          echo "MITTS=$MITTS_INSTALL_ROOT/bin/mitts" >> "$GITHUB_ENV"
      - name: Build the exact-source Linux Mitts (the cross build needs this source's fixes)
        run: |
          "$MITTS" build --locked --release --bin mitts --cache-dir "$RUNNER_TEMP/mitts-cache" \
            --target-dir "$RUNNER_TEMP/host"
          "$RUNNER_TEMP/host/release/mitts" --version
          echo "MITTS=$RUNNER_TEMP/host/release/mitts" >> "$GITHUB_ENV"
      - name: Build mitts.exe
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        run: |
          "$MITTS" build --locked --release --bin mitts \
            --target x86_64-pc-windows-gnu \
            --cache-dir "$RUNNER_TEMP/mitts-cache" --target-dir "$RUNNER_TEMP/target"
          cp "$RUNNER_TEMP/target/x86_64-pc-windows-gnu/release/mitts.exe" mitts.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mitts-windows-gnu
          path: mitts.exe
          if-no-files-found: error

  native:
    name: native (windows-2022)
    needs: cross
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mitts-windows-gnu
          path: ${{ runner.temp }}/bootstrap
      - name: Bootstrap binary runs
        run: |
          boot="$RUNNER_TEMP/bootstrap/mitts.exe"
          "$boot" --version
          echo "BOOT=$boot" >> "$GITHUB_ENV"
      - name: Build Mitts natively (MSVC) with the bootstrap
        run: |
          "$BOOT" build --locked --bin mitts --cache-dir "$RUNNER_TEMP/mitts-cache" \
            --target-dir "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/candidate/debug/mitts.exe" --version
          echo "MITTS=$RUNNER_TEMP/candidate/debug/mitts.exe" >> "$GITHUB_ENV"
      - name: Test suite in the isolated runner (report only during bring-up)
        continue-on-error: true
        env:
          MITTS_CI_BIN: ${{ env.MITTS }}
          MITTS_CI_CACHE_DIR: ${{ runner.temp }}/mitts-cache
        run: |
          bash scripts/run_tests_isolated.sh --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Failure summary
        if: always()
        run: |
          {
            echo '## Windows test failures'
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/test.log" | sort | uniq -c | sort -rn | head -200 || true
            grep -E '^test result:' "$RUNNER_TEMP/test.log" | awk '{p+=$4; f+=$6} END {print "passed", p, "failed", f}' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore
